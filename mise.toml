[tools]
node = "24.16.0"

[tasks.install]
description = "Install project dependencies"
run = "npm ci"

[tasks.dev]
description = "Start the Next.js development server"
run = "npm run dev"

[tasks.lint]
description = "Run ESLint"
run = "npm run lint"

[tasks.test]
description = "Run unit tests"
run = "npm test"

[tasks.build]
description = "Build the static site for GitHub Pages"
run = "npm run build"

[tasks.check]
description = "Run lint, typecheck, tests, data check, build and UI test"
run = "npm run check"

[tasks.start]
description = "Start the production server"
run = "npm run start"
