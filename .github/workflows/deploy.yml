name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 每 12 小时用最新 AA 数据重建一次站点
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate catalog data
        run: node scripts/build-data.mjs

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /code-pareto
          NEXT_TELEMETRY_DISABLED: "1"
        run: node node_modules/next/dist/bin/next build

      - name: Commit refreshed catalog when it changes
        run: |
          if ! git diff --quiet -- src/data/catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/catalog.json
            git commit -m "chore: refresh Artificial Analysis catalog"
            git push origin HEAD:main
          else
            echo "catalog unchanged"
          fi

      - name: Keep scheduled rebuilds enabled
        run: |
          # GitHub 会在仓库 60 天无活动时自动停用 schedule，这里每 30 天补一次心跳提交
          if [ -z "$(git log --since='30 days ago' --format=%H -1)" ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat.txt
            git commit -m "chore: heartbeat to keep scheduled rebuilds enabled"
            git push origin HEAD:main
          else
            echo "recent activity exists"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
