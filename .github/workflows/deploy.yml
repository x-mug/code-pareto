name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 每 12 小时用最新 AA 数据重建一次站点
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 不加 --omit=dev，lint / typecheck / test / ui:test 要靠 devDependencies 才能跑
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate catalog data
        id: catalog
        continue-on-error: true
        run: |
          npm run data:build
          npm run data:check

      - name: Restore catalog after refresh failure
        if: steps.catalog.outcome == 'failure'
        run: |
          git restore --source=HEAD --worktree -- src/data/catalog.json src/data/recent-model-updates.json
          echo "::warning::AA refresh or validation failed; deploying the last committed catalog instead"

      - name: Validate catalog data
        run: npm run data:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # build 脚本已内置静态导出所需的 basePath，这里不重复传
      - name: Build static site
        run: npm run build

      # ui:test 自己起本地静态服务加载 out/，不需要额外 server 步骤
      - name: UI tests
        run: npm run ui:test

      - name: Commit refreshed catalog and model updates when they change
        run: |
          if [ -n "$(git status --porcelain -- src/data/catalog.json src/data/recent-model-updates.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/catalog.json src/data/recent-model-updates.json
            git commit -m "chore: refresh Artificial Analysis catalog"
            git push origin HEAD:main
          else
            echo "catalog and model updates unchanged"
          fi

      - name: Keep scheduled rebuilds enabled
        run: |
          # GitHub 会在仓库 60 天无活动时自动停用 schedule，这里每 30 天补一次心跳提交
          if [ -z "$(git log --since='30 days ago' --format=%H -1)" ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/heartbeat.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat.txt
            git commit -m "chore: heartbeat to keep scheduled rebuilds enabled"
            git push origin HEAD:main
          else
            echo "recent activity exists"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
